plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mvrisley.pipemagic'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mvrisley.pipemagic'
        minSdk 23
        targetSdk 35
        versionCode 14
        versionName '1.13'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
